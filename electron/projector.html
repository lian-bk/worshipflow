<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WorshipFlow Projector</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        background: #000000;
        overflow: hidden;
        cursor: none;
      }
      #stage {
        width: 100vw;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        box-sizing: border-box;
        padding: 6vh 8vw;
        background: #000000;
        background-size: cover;
        background-position: center;
        color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        transition: background-color 0.15s ease;
      }
      #stage.has-photo #label,
      #stage.has-photo #content {
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.85);
      }
      #label {
        font-size: 2vw;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        opacity: 0.6;
        margin-bottom: 2vh;
      }
      #content {
        font-size: 6vw;
        font-weight: 600;
        line-height: 1.3;
        white-space: pre-wrap;
        max-width: 100%;
      }
      #tagline {
        font-size: 2.2vw;
        opacity: 0.75;
        margin-top: 2vh;
      }
      #image {
        max-width: 92vw;
        max-height: 92vh;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="label" style="display: none"></div>
      <div id="content"></div>
      <div id="tagline" style="display: none"></div>
    </div>
    <script>
      const stage = document.getElementById("stage");
      const labelEl = document.getElementById("label");
      const contentEl = document.getElementById("content");
      const taglineEl = document.getElementById("tagline");

      const JUSTIFY_FOR = { left: "flex-start", center: "center", right: "flex-end" };
      const ALIGN_FOR = { top: "flex-start", middle: "center", bottom: "flex-end" };

      // Same rough "shrink to fit" heuristic as live-show-types.ts (autoFitScale) —
      // kept in sync by hand since this file is plain JS, not shared TS.
      function autoFitScale(content) {
        const len = (content || "").length;
        if (len > 220) return 0.55;
        if (len > 160) return 0.65;
        if (len > 110) return 0.78;
        if (len > 70) return 0.9;
        return 1;
      }

      function setTextPosition(hAlign, vAlign) {
        stage.style.alignItems = JUSTIFY_FOR[hAlign] || JUSTIFY_FOR.center;
        stage.style.justifyContent = ALIGN_FOR[vAlign] || ALIGN_FOR.middle;
        stage.style.textAlign = hAlign || "center";
      }

      function clearStage() {
        stage.innerHTML = "";
        stage.appendChild(labelEl);
        stage.appendChild(contentEl);
        stage.appendChild(taglineEl);
        labelEl.style.display = "none";
        taglineEl.style.display = "none";
        contentEl.textContent = "";
        contentEl.style.fontSize = "";
        stage.style.backgroundImage = "";
        stage.classList.remove("has-photo");
        setTextPosition("center", "middle");
      }

      function render(payload) {
        if (!payload || payload.type === "blank") {
          clearStage();
          stage.style.backgroundColor = "#000000";
          stage.style.color = "#ffffff";
          stage.style.fontFamily = "";
          return;
        }

        if (payload.type === "logo") {
          clearStage();
          stage.style.backgroundColor = "#0f172a";
          stage.style.color = "#ffffff";
          stage.style.fontFamily = "";
          contentEl.textContent = payload.churchName || "";
          if (payload.tagline) {
            taglineEl.textContent = payload.tagline;
            taglineEl.style.display = "block";
          }
          return;
        }

        // type === "slide"
        const slide = payload.slide || {};
        stage.style.backgroundColor = slide.backgroundColor || "#0f172a";
        stage.style.color = slide.textColor || "#ffffff";
        stage.style.fontFamily = slide.fontFamily || "";
        setTextPosition(slide.textHAlign, slide.textVAlign);
        const scale = ((slide.textScale || 100) / 100) * autoFitScale(slide.content);
        contentEl.style.fontSize = 6 * scale + "vw";

        if (slide.kind === "image" && slide.imageUrl) {
          stage.innerHTML = "";
          stage.style.backgroundImage = "";
          stage.classList.remove("has-photo");
          const img = document.createElement("img");
          img.id = "image";
          img.src = slide.imageUrl;
          img.alt = slide.content || "";
          stage.appendChild(img);
          return;
        }

        clearStage();
        // A theme's background photo, separate from a "media" item's
        // full-slide image above — text is drawn on top of it.
        if (slide.backgroundImageUrl) {
          stage.style.backgroundImage = `url(${slide.backgroundImageUrl})`;
          stage.classList.add("has-photo");
        }
        if (slide.label) {
          labelEl.textContent = slide.label;
          labelEl.style.display = "block";
        }
        contentEl.textContent = slide.content || "";
      }

      // Starting state: black, nothing live yet.
      render({ type: "blank" });

      if (window.projectorAPI) {
        window.projectorAPI.onSlideUpdate(render);
      }
    </script>
  </body>
</html>
